<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator - Interactive Web Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">My Project</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="portfolio.html">Portfolio</a></li>
                    <li class="nav-item"><a class="nav-link" href="blog.html">Blog</a></li>
                    <li class="nav-item"><a class="nav-link" href="products.html">Store</a></li>
                    <li class="nav-item"><a class="nav-link active" href="calculator.html">Calculator</a></li>
                    <li class="nav-item"><a class="nav-link" href="consultation.html">Consultation</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5 d-flex justify-content-center">
        <div class="card p-4 shadow" style="max-width: 350px; width: 100%;">
            <h3 class="text-center mb-3 fw-bold">Simple Calculator</h3>
            <input type="text" id="calcDisplay" class="form-control form-control-lg text-end mb-3" readonly value="0">
            <div class="row g-2">
                <div class="col-3"><button class="btn btn-secondary w-100 calc-btn">7</button></div>
                <div class="col-3"><button class="btn btn-secondary w-100 calc-btn">8</button></div>
                <div class="col-3"><button class="btn btn-secondary w-100 calc-btn">9</button></div>
                <div class="col-3"><button class="btn btn-warning w-100 calc-op">+</button></div>
                
                <div class="col-3"><button class="btn btn-secondary w-100 calc-btn">4</button></div>
                <div class="col-3"><button class="btn btn-secondary w-100 calc-btn">5</button></div>
                <div class="col-3"><button class="btn btn-secondary w-100 calc-btn">6</button></div>
                <div class="col-3"><button class="btn btn-warning w-100 calc-op">-</button></div>

                <div class="col-3"><button class="btn btn-secondary w-100 calc-btn">1</button></div>
                <div class="col-3"><button class="btn btn-secondary w-100 calc-btn">2</button></div>
                <div class="col-3"><button class="btn btn-secondary w-100 calc-btn">3</button></div>
                <div class="col-3"><button class="btn btn-warning w-100 calc-op">*</button></div>

                <div class="col-3"><button class="btn btn-danger w-100" id="calcClear">C</button></div>
                <div class="col-3"><button class="btn btn-secondary w-100 calc-btn">0</button></div>
                <div class="col-3"><button class="btn btn-success w-100" id="calcEquals">=</button></div>
                <div class="col-3"><button class="btn btn-warning w-100 calc-op">/</button></div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">&copy; 2026 All Rights Reserved - Nada's Project</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
